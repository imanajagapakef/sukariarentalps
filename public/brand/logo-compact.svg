<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <!-- Klub Sukaria Compact Logo for Mobile Headers, Sticky Navs, Admin Sidebars -->
  <defs>
    <linearGradient id="compactNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee450"/>
      <stop offset="100%" stop-color="#20a83a"/>
    </linearGradient>
  </defs>

  <!-- Brand Emblem 44x44 -->
  <g transform="translate(6, 10)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
    <rect x="3" y="3" width="38" height="38" rx="8" fill="#111111"/>

    <!-- Neon Cross / Console Accent -->
    <rect x="18" y="9" width="8" height="26" rx="2.5" fill="url(#compactNeonGrad)"/>
    <rect x="9" y="18" width="26" height="8" rx="2.5" fill="url(#compactNeonGrad)"/>
    <circle cx="22" cy="22" r="3.5" fill="#0e0e0e"/>
  </g>

  <!-- Wordmark Compact -->
  <text x="60" y="36" font-family="'Anton', 'Impact', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">KLUB <tspan fill="#20a83a">SUKARIA</tspan></text>
  <text x="61" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#20a83a" letter-spacing="1.5">GAMING HOUSE 24H</text>
</svg>
