<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" width="420" height="84" fill="none">
  <!-- Klub Sukaria Official Primary Wordmark + Emblem -->
  <defs>
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee450"/>
      <stop offset="100%" stop-color="#20a83a"/>
    </linearGradient>
    <filter id="neonDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#20a83a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Brand Emblem: Gaming Station Monogram (Square Box + Console Cross/D-Pad + Glowing S/Pulse) -->
  <g transform="translate(10, 10)">
    <!-- Base Icon Container -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#181818" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121212"/>

    <!-- Neon Corner Accent -->
    <path d="M12 18 L12 12 L18 12" stroke="#20a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 46 L52 52 L46 52" stroke="#20a83a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stylized D-Pad & 'S' Geometric Emblem -->
    <rect x="27" y="14" width="10" height="36" rx="3" fill="url(#neonGlowGrad)" filter="url(#neonDrop)"/>
    <rect x="14" y="27" width="36" height="10" rx="3" fill="url(#neonGlowGrad)" filter="url(#neonDrop)"/>
    <circle cx="32" cy="32" r="4.5" fill="#0e0e0e"/>

    <!-- Tiny Console Dots -->
    <circle cx="19" cy="19" r="2" fill="#20a83a" opacity="0.8"/>
    <circle cx="45" cy="45" r="2" fill="#20a83a" opacity="0.8"/>
  </g>

  <!-- Typography: KLUB SUKARIA + Subtitle -->
  <!-- "KLUB" -->
  <text x="88" y="44" font-family="'Anton', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">KLUB</text>

  <!-- "SUKARIA" with brand green highlight -->
  <text x="178" y="44" font-family="'Anton', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#20a83a" letter-spacing="1.5">SUKARIA</text>

  <!-- Tagline / Subtitle Pill & Text -->
  <g transform="translate(88, 54)">
    <rect x="0" y="0" width="112" height="18" rx="4" fill="#20a83a"/>
    <text x="56" y="13" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0b0b0b" text-anchor="middle" letter-spacing="1.2">GAMING HOUSE</text>
    <text x="122" y="13" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#888888" letter-spacing="1.5">• 24 JAM TANJUNGPINANG</text>
  </g>
</svg>
